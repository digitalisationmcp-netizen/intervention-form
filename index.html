<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demande d’intervention</title>
  <style>
    :root{
      --brand:#d6bf9f; /* couleur du logo */
      --bg:#0f0f10;
      --card:#161718;
      --text:#e8e8ea;
      --muted:#a7a7ad;
      --ring:#27282b;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial;
      background:linear-gradient(180deg,#0c0c0d, #141516 35%, #0c0c0d);
      color:var(--text); padding:32px;
      display:flex; justify-content:center;
    }
    .wrap{width:100%; max-width:760px}
    .card{
      background:var(--card); border:1px solid var(--ring);
      border-radius:20px; padding:24px 20px; box-shadow:0 10px 30px rgba(0,0,0,.28);
    }
    header{display:flex; align-items:center; gap:14px; margin-bottom:18px}
    header img{height:40px; width:auto}
    header h1{font-size:18px; font-weight:700; margin:0}
    p.helper{color:var(--muted); margin:0 0 18px}
    form{display:grid; grid-template-columns:1fr 1fr; gap:16px}
    .row-1{grid-column:span 1}
    .row-2{grid-column:span 2}
    label{display:block; font-size:12px; color:var(--muted); margin:0 0 6px 2px}
    input, select, textarea{
      width:100%; background:#0f1011; color:var(--text); border:1px solid var(--ring);
      border-radius:12px; padding:12px 12px; outline:none; font-size:14px;
    }
    input[type="file"]{padding:10px; background:#0f1011}
    textarea{min-height:110px; resize:vertical}
    .hint{font-size:12px; color:var(--muted); margin-top:6px}
    .actions{display:flex; gap:10px; margin-top:14px}
    button{
      appearance:none; border:1px solid var(--ring); background:var(--brand); color:#1a1a1a;
      padding:12px 16px; border-radius:12px; font-weight:700; cursor:pointer;
    }
    button.secondary{background:transparent; color:var(--text)}
    .success,.error{
      margin-top:14px; padding:12px 14px; border-radius:12px; border:1px solid var(--ring);
      display:none;
    }
    .success{background:#0d1a12; color:#b7f1c5; border-color:#153a25}
    .error{background:#1a0d0d; color:#f4b2b2; border-color:#3f1b1b}
    .req{color:#eaa; font-weight:700}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <!-- Logo intégré (data URI) -->
        <img alt="Logo" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAeAAAAHgCAYAAABQmD1/AAAACXBIWXMAAAsTAAALEwEAmpwYAA..." />
        <h1>Demande d’intervention</h1>
      </header>
      <p class="helper">Merci de renseigner les informations. Les champs marqués <span class="req">*</span> sont obligatoires.</p>

      <form id="form">
        <!-- Nom de logement (liste sans IDs) -->
        <div class="row-1">
          <label for="nomLogement">Nom de logement <span class="req">*</span></label>
          <select id="nomLogement" required>
            <option value="" disabled selected>Choisir…</option>
            <option>Argane</option>
            <option>Bensalem1</option>
            <option>Bensalem9</option>
            <option>Berrada</option>
            <option>Bouznika</option>
            <option>Daraa</option>
            <option>Granada</option>
            <option>Harhoura</option>
            <option>Marbella</option>
            <option>Melouya</option>
            <option>Ouhoud</option>
            <option>Sebou</option>
            <option>Skhirat</option>
            <option>Wifak</option>
            <option>CFC Louise 2</option>
          </select>
        </div>

        <!-- Nom complet (liste déroulante) -->
        <div class="row-1">
          <label for="nomComplet">Nom complet (liste) <span class="req">*</span></label>
          <select id="nomComplet" required>
            <option value="" disabled selected>Choisir…</option>
            <option>Driss Alami</option>
            <option>Mohamed Belhabes</option>
            <option>Technicien 1</option>
            <option>Technicien 2</option>
          </select>
        </div>

        <!-- Date intervention -->
        <div class="row-1">
          <label for="dateIntervention">Date d’intervention <span class="req">*</span></label>
          <input id="dateIntervention" type="date" required />
        </div>

        <!-- Urgence -->
        <div class="row-1">
          <label for="urgence">Niveau d’urgence</label>
          <select id="urgence">
            <option value="" selected>—</option>
            <option>Faible</option>
            <option>Moyenne</option>
            <option>Haute</option>
          </select>
        </div>

        <!-- Description -->
        <div class="row-2">
          <label for="description">Description du problème <span class="req">*</span></label>
          <textarea id="description" placeholder="Explique le souci, l’emplacement…"
            required></textarea>
        </div>

        <!-- Montant des fournitures -->
        <div class="row-1">
          <label for="montantFournitures">Montant des fournitures (MAD)</label>
          <input id="montantFournitures" type="number" min="0" step="0.01" placeholder="0.00" />
          <div class="hint">Laisse vide si non concerné.</div>
        </div>

        <!-- Photos intervention -->
        <div class="row-1">
          <label for="photosIntervention">Photos de l’intervention</label>
          <input id="photosIntervention" type="file" accept="image/*" multiple />
          <div class="hint">Tu peux sélectionner plusieurs images.</div>
        </div>

        <!-- Photos des bons -->
        <div class="row-2">
          <label for="photosBons">Photos des bons</label>
          <input id="photosBons" type="file" accept="image/*" multiple />
        </div>

        <!-- Coordonnées (si tu veux les garder) -->
        <div class="row-1">
          <label for="telephone">Téléphone</label>
          <input id="telephone" type="tel" placeholder="+212..." />
        </div>
        <div class="row-1">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="nom@exemple.com" />
        </div>

        <div class="row-2 actions">
          <button type="submit">Envoyer</button>
          <button class="secondary" type="reset">Réinitialiser</button>
        </div>

        <div id="ok" class="success">Intervention envoyée ✅</div>
        <div id="ko" class="error">Erreur d’envoi. Réessaie ou contacte un admin.</div>
      </form>
    </div>
  </div>

  <script>
    // === CONFIG ===
    const WEBHOOK_URL = "https://n8n.srv928014.hstgr.cloud/webhook/intervention-v1";

    // Convert selected files -> base64 strings (Data URLs)
    async function filesToBase64(fileList){
      const toB64 = (file) => new Promise((resolve, reject)=>{
        const r = new FileReader();
        r.onload = () => resolve(r.result);   // data:image/...;base64,XXXX
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      const arr = [];
      for(const f of fileList || []) arr.push(await toB64(f));
      return arr;
    }

    const form = document.getElementById("form");
    const okEl  = document.getElementById("ok");
    const koEl  = document.getElementById("ko");

    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      okEl.style.display = "none";
      koEl.style.display = "none";

      // Récupération des valeurs
      const payload = {
        nomLogement:       document.getElementById("nomLogement").value || null,
        nomComplet:        document.getElementById("nomComplet").value || null,
        dateIntervention:  document.getElementById("dateIntervention").value || null,
        urgence:           document.getElementById("urgence").value || null,
        description:       document.getElementById("description").value?.trim() || null,
        montantFournitures: document.getElementById("montantFournitures").value || null,
        telephone:         document.getElementById("telephone").value || null,
        email:             document.getElementById("email").value || null,
        // Fichiers encodés (base64)
        photosIntervention: await filesToBase64(document.getElementById("photosIntervention").files),
        photosBons:         await filesToBase64(document.getElementById("photosBons").files),
        // horodatage
        dateSubmission:     new Date().toISOString()
      };

      // Envoi JSON vers n8n
      try{
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if(!res.ok){
          const txt = await res.text().catch(()=> "");
          throw new Error(`HTTP ${res.status} – ${txt}`);
        }

        okEl.style.display = "block";
        form.reset();
      }catch(err){
        console.error(err);
        koEl.textContent = "Erreur d’envoi : " + err.message;
        koEl.style.display = "block";
      }
    });
  </script>
</body>
</html>
