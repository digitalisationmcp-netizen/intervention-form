<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Demande d'intervention - My Cosy Place</title>
  <style>
    :root{
      --brand:#d6bf9f;
      --brand-600:#c9ad8a;
      --ink:#2b2f33;
      --muted:#6a7177;
      --bg:#f7f6f3;
      --card:#ffffff;
      --ring:#e8e4dc;
      --ring-strong:#d8d1c4;
      --success:#0f8f4b;
      --error:#b23b3b;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; 
      font:16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--ink); 
      background:
        radial-gradient(1200px 500px at 90% -10%, #efe8dd 0, transparent 70%),
        radial-gradient(1200px 500px at -10% 110%, #efe8dd 0, transparent 70%),
        var(--bg);
      display:flex; 
      justify-content:center; 
      padding:20px;
      min-height:100vh;
    }
    .wrap{width:100%; max-width:960px}
    .card{
      background:var(--card); 
      border:1px solid var(--ring); 
      border-radius:22px;
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      padding:32px 28px; 
      margin:auto;
    }
    
    /* Header avec logo */
    header{
      display:flex; 
      flex-direction:column;
      align-items:center; 
      gap:16px; 
      padding:0 0 24px;
      border-bottom:2px solid var(--ring);
      margin-bottom:24px;
    }
    .logo-container{
      display:flex;
      align-items:center;
      gap:20px;
    }
    .logo-svg{
      width:180px;
      height:auto;
    }
    header h1{
      font-size:24px; 
      margin:0; 
      font-weight:800; 
      letter-spacing:.3px;
      text-align:center;
    }
    .badge{
      display:inline-block; 
      background:#fff7ea; 
      color:#6c4b1a; 
      border:1px solid #f0e2c7;
      font-size:12px; 
      padding:6px 12px; 
      border-radius:999px; 
      margin-top:8px;
      font-weight:600;
    }
    
    p.helper{
      color:var(--muted); 
      margin:0 0 24px;
      text-align:center;
      font-size:14px;
    }

    form{display:grid; grid-template-columns:1fr; gap:20px}
    @media (min-width:720px){
      form{grid-template-columns:1fr 1fr}
    }
    .span-2{grid-column:1 / -1}
    
    .field-group{
      display:flex;
      flex-direction:column;
    }
    
    label{
      display:block; 
      font-size:14px; 
      color:#4b5258; 
      margin:0 0 8px 4px; 
      font-weight:600;
    }
    .req{color:#b83b3b; margin-left:2px;}

    input, select, textarea{
      width:100%; 
      background:#fff; 
      color:var(--ink);
      border:1px solid var(--ring); 
      border-radius:12px; 
      padding:12px 14px;
      font-size:15px; 
      outline:none; 
      transition:all .2s;
      font-family:inherit;
    }
    textarea{
      min-height:120px; 
      resize:vertical;
      line-height:1.5;
    }
    input[type="file"]{
      padding:10px; 
      background:#fafaf9;
      cursor:pointer;
    }
    input:focus, select:focus, textarea:focus{
      border-color:var(--brand-600);
      box-shadow:0 0 0 4px rgba(214,191,159,.25);
    }
    input:hover, select:hover, textarea:hover{
      border-color:var(--brand-600);
    }
    
    .hint{
      font-size:12px; 
      color:var(--muted); 
      margin-top:6px;
      padding-left:4px;
    }

    .actions{
      display:flex; 
      gap:12px; 
      margin-top:8px;
    }
    button{
      flex:1;
      appearance:none; 
      border:none;
      background:linear-gradient(135deg, #e9dcc8, #d6bf9f);
      color:#2b2a27; 
      padding:14px 20px; 
      border-radius:12px; 
      font-weight:700; 
      font-size:15px;
      cursor:pointer;
      transition:all .2s;
      box-shadow:0 2px 8px rgba(214,191,159,.3);
    }
    button:hover{
      transform:translateY(-2px);
      box-shadow:0 4px 12px rgba(214,191,159,.4);
    }
    button:active{
      transform:translateY(0);
    }
    button.secondary{
      background:#fff;
      border:1px solid var(--ring-strong);
      box-shadow:none;
    }
    button.secondary:hover{
      background:#fafaf9;
    }

    .alert{
      display:none; 
      margin-top:16px; 
      padding:14px 16px; 
      border-radius:12px; 
      border:1px solid;
      font-weight:500;
      animation:slideIn .3s ease;
    }
    @keyframes slideIn{
      from{opacity:0; transform:translateY(-10px)}
      to{opacity:1; transform:translateY(0)}
    }
    .alert.ok{
      background:#f0fbf5; 
      border-color:#bfe8cf; 
      color:#0f6538;
    }
    .alert.ko{
      background:#fff5f5; 
      border-color:#f0c7c7; 
      color:#8b2a2a;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <svg class="logo-svg" viewBox="0 0 440 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Maison stylisée -->
          <path d="M 75 20 L 95 40 L 95 75 L 55 75 L 55 40 Z" stroke="#d6bf9f" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="62" y="50" width="12" height="25" stroke="#1a1a1a" stroke-width="2" fill="none"/>
          <line x1="80" y1="50" x2="80" y2="75" stroke="#1a1a1a" stroke-width="2"/>
          <line x1="85" y1="55" x2="85" y2="75" stroke="#1a1a1a" stroke-width="2"/>
          <line x1="90" y1="60" x2="90" y2="75" stroke="#1a1a1a" stroke-width="2"/>
          <path d="M 50 75 L 435 75" stroke="#d6bf9f" stroke-width="4" stroke-linecap="round"/>
          
          <!-- Texte MY COSY PLACE -->
          <text x="175" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1a1a1a">MY COSY PLACE</text>
          <text x="185" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#666" letter-spacing="3">CONCIERGERIE RABAT</text>
        </svg>
        
        <div>
          <h1>Demande d'intervention</h1>
          <div class="badge">Gestion locative</div>
        </div>
      </header>

      <p class="helper">Merci de renseigner les informations. Les champs marqués <span class="req">*</span> sont obligatoires.</p>

      <form id="form">
        <div class="field-group">
          <label for="nomLogement">Nom de logement<span class="req">*</span></label>
          <select id="nomLogement" required>
            <option value="" disabled selected>Choisir un logement…</option>
            <option>Argane</option>
            <option>Bensalem1</option>
            <option>Bensalem9</option>
            <option>Berrada</option>
            <option>Bouznika</option>
            <option>Daraa</option>
            <option>Granada</option>
            <option>Harhoura</option>
            <option>Marbella</option>
            <option>Melouya</option>
            <option>Ouhoud</option>
            <option>Sebou</option>
            <option>Skhirat</option>
            <option>Wifak</option>
            <option>CFC Louise 2</option>
          </select>
        </div>

        <div class="field-group">
          <label for="nomComplet">Nom complet<span class="req">*</span></label>
          <select id="nomComplet" required>
            <option value="" disabled selected>Sélectionner…</option>
            <option>Aziz</option>
            <option>Tarik aluminuim</option>
            <option>Hamid Peinture</option>
            <option>technicien Clim</option>
            <option>Jardinier</option>
          </select>
        </div>

        <div class="field-group">
          <label for="dateIntervention">Date d'intervention<span class="req">*</span></label>
          <input id="dateIntervention" type="date" required />
        </div>
        
        <div class="field-group">
          <label for="urgence">Niveau d'urgence</label>
          <select id="urgence">
            <option value="">Non spécifié</option>
            <option>Faible</option>
            <option>Moyenne</option>
            <option>Haute</option>
          </select>
        </div>

        <div class="field-group span-2">
          <label for="description">Description du problème<span class="req">*</span></label>
          <textarea id="description" placeholder="Décrivez le problème et l'emplacement concerné…" required></textarea>
        </div>

        <div class="field-group">
          <label for="montantFournitures">Montant des fournitures (MAD)</label>
          <input id="montantFournitures" type="number" min="0" step="0.01" placeholder="0.00" />
          <div class="hint">Laissez vide si non applicable</div>
        </div>
        
        <div class="field-group">
          <label for="photosIntervention">Photos de l'intervention</label>
          <input id="photosIntervention" type="file" accept="image/*" multiple />
          <div class="hint">Plusieurs fichiers acceptés</div>
        </div>

        <div class="field-group span-2">
          <label for="photosBons">Photos des bons</label>
          <input id="photosBons" type="file" accept="image/*" multiple />
        </div>

        <div class="field-group">
          <label for="telephone">Téléphone</label>
          <input id="telephone" type="tel" placeholder="+212 6XX XXX XXX" />
        </div>
        
        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="nom@exemple.com" />
        </div>

        <div class="span-2 actions">
          <button type="submit">📤 Envoyer la demande</button>
          <button class="secondary" type="reset">🔄 Réinitialiser</button>
        </div>

        <div id="ok" class="alert ok"></div>
        <div id="ko" class="alert ko"></div>
      </form>
    </div>
  </div>

  <script>
    const WEBHOOK_URL = "https://n8n.srv928014.hstgr.cloud/webhook/intervention-v1";

    async function filesToBase64(fileList){
      const toB64 = (file) => new Promise((resolve, reject)=>{
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
      const out = [];
      for(const f of fileList || []) out.push(await toB64(f));
      return out;
    }

    const form = document.getElementById("form");
    const okEl  = document.getElementById("ok");
    const koEl  = document.getElementById("ko");

    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      okEl.style.display = "none";
      koEl.style.display = "none";

      const submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = "⏳ Envoi en cours...";

      const payload = {
        adresse:           document.getElementById("nomLogement").value || null,
        nomDemandeur:      document.getElementById("nomComplet").value || null,
        dateIntervention:  document.getElementById("dateIntervention").value || null,
        urgence:           document.getElementById("urgence").value || null,
        description:       document.getElementById("description").value?.trim() || null,
        telephone:         document.getElementById("telephone").value || null,
        email:             document.getElementById("email").value || null,
        montantFournitures: document.getElementById("montantFournitures").value || null,
        photosIntervention: await filesToBase64(document.getElementById("photosIntervention").files),
        photosBons:         await filesToBase64(document.getElementById("photosBons").files),
        dateSubmission:    new Date().toISOString(),
        // Champs optionnels pour compatibilité
        categorie:         null,
        sousCategorie:     null,
        materielNecessaire: null,
        materielDetails:   null,
        notes:             null
      };

      try{
        const res = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if(!res.ok){
          const txt = await res.text().catch(()=> "");
          throw new Error(`HTTP ${res.status} – ${txt}`);
        }
        
        okEl.textContent = "✅ Demande d'intervention envoyée avec succès !";
        okEl.style.display = "block";
        form.reset();
        
        setTimeout(() => {
          okEl.style.display = "none";
        }, 5000);
        
      }catch(err){
        koEl.textContent = "❌ Erreur lors de l'envoi : " + err.message;
        koEl.style.display = "block";
      }finally{
        submitBtn.disabled = false;
        submitBtn.textContent = "📤 Envoyer la demande";
      }
    });
  </script>
</body>
</html>
