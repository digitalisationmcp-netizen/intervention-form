<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande d'Intervention Technique</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState } = React;
        
        const categories = {
          "Plomberie & Sanitaires": [
            "Chasse d'eau / mécanisme",
            "Lavabo / siphon / évier",
            "Fuites / joints",
            "Douchette / pommeau / flexible",
            "Caniveaux & débouchage",
            "Autre"
          ],
          "Électricité & Éclairage": [
            "Prises & interrupteurs",
            "Spots / ampoules / transformateurs",
            "Disjoncteur / fusible",
            "Petits raccordements (domino, câblage)",
            "Autre"
          ],
          "Électroménager": [
            "Réfrigérateur (dégivrage, panne)",
            "Lave-linge (vidange, joint, résistance)",
            "Plaques & four",
            "Hotte aspirante",
            "Petit électroménager",
            "Autre"
          ],
          "Climatisation & Chauffe-eau": [
            "Installation / dépose",
            "Réparation fuite / tuyauterie",
            "Résistance / thermostat",
            "Réglage / entretien",
            "Télécommandes & piles",
            "Autre"
          ],
          "Mobilier & Menuiserie": [
            "Montage / démontage IKEA",
            "Réparation placards, tiroirs, portes",
            "Serrage vis/boulons chaises",
            "Stores & rideaux",
            "Lits & rangements",
            "Autre"
          ],
          "Serrurerie & Quincaillerie": [
            "Serrures (chambre, WC, placard)",
            "Clés / copies / boîtes à clés",
            "Poignées & verrous",
            "Portes bloquées",
            "Autre"
          ],
          "Peinture & Finitions": [
            "Retouches peinture",
            "Papier peint / collage",
            "Lustrage robinetterie & chromes",
            "Autre"
          ],
          "Nettoyage & Entretien courant": [
            "Plaques, évier, électroménager",
            "Vitres & miroirs",
            "Pressing (linge, couettes, rideaux)",
            "Produits & consommables",
            "Autre"
          ],
          "Jardin & Plantes": [
            "Arrosage / traitement plantes",
            "Parasols & mobilier extérieur",
            "Traitement des sols/jardin",
            "Autre"
          ],
          "Nuisibles & Hygiène": [
            "Fourmis / cafards / rats",
            "Moucherons / puces de lit",
            "Désodorisants / insecticides",
            "Autre"
          ]
        };

        function InterventionForm() {
          const [formData, setFormData] = useState({
            nomLogement: '',
            adresse: '',
            dateIntervention: '',
            urgence: '',
            categorie: '',
            sousCategorie: '',
            description: '',
            materielNecessaire: '',
            materielDetails: '',
            nomDemandeur: '',
            telephone: '',
            email: '',
            notes: ''
          });

          const [isSubmitting, setIsSubmitting] = useState(false);
          const [submitStatus, setSubmitStatus] = useState(null);

          const handleChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => ({
              ...prev,
              [name]: value,
              ...(name === 'categorie' && { sousCategorie: '' })
            }));
          };

          const handleSubmit = async () => {
            if (!formData.nomLogement || !formData.adresse || !formData.dateIntervention || 
                !formData.urgence || !formData.categorie || !formData.sousCategorie || 
                !formData.description || !formData.materielNecessaire || 
                !formData.nomDemandeur || !formData.telephone || !formData.email) {
              alert('Veuillez remplir tous les champs obligatoires (*)');
              return;
            }

            setIsSubmitting(true);
            setSubmitStatus(null);

            try {
              // ⚠️ REMPLACE CETTE URL PAR TON WEBHOOK N8N
              const webhookUrl = 'https://TON-N8N.app.n8n.cloud/webhook/intervention';
              
              const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  ...formData,
                  dateSubmission: new Date().toISOString()
                })
              });

              if (response.ok) {
                setSubmitStatus('success');
                setFormData({
                  nomLogement: '',
                  adresse: '',
                  dateIntervention: '',
                  urgence: '',
                  categorie: '',
                  sousCategorie: '',
                  description: '',
                  materielNecessaire: '',
                  materielDetails: '',
                  nomDemandeur: '',
                  telephone: '',
                  email: '',
                  notes: ''
                });
              } else {
                setSubmitStatus('error');
              }
            } catch (error) {
              console.error('Erreur:', error);
              setSubmitStatus('error');
            } finally {
              setIsSubmitting(false);
            }
          };

          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 py-12 px-4">
              <div className="max-w-3xl mx-auto">
                <div className="bg-white rounded-2xl shadow-xl p-8">
                  <div className="text-center mb-8">
                    <h1 className="text-3xl font-bold text-gray-900 mb-2">
                      Demande d'Intervention Technique
                    </h1>
                    <p className="text-gray-600">
                      Remplissez ce formulaire pour signaler une intervention
                    </p>
                  </div>

                  {submitStatus === 'success' && (
                    <div className="mb-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                      <p className="text-green-800 font-medium">
                        ✅ Demande envoyée avec succès ! Nous vous contacterons bientôt.
                      </p>
                    </div>
                  )}

                  {submitStatus === 'error' && (
                    <div className="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                      <p className="text-red-800 font-medium">
                        ❌ Erreur lors de l'envoi. Veuillez réessayer.
                      </p>
                    </div>
                  )}

                  <div className="space-y-6">
                    {/* Informations de base */}
                    <div className="space-y-4">
                      <h2 className="text-xl font-semibold text-gray-800 border-b pb-2">
                        📍 Informations du logement
                      </h2>
                      
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                          Nom du logement *
                        </label>
                        <input
                          type="text"
                          name="nomLogement"
                          value={formData.nomLogement}
                          onChange={handleChange}
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                          placeholder="Ex: Wifak"
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                          Adresse *
                        </label>
                        <input
                          type="text"
                          name="adresse"
                          value={formData.adresse}
                          onChange={handleChange}
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                          placeholder="Adresse complète"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">
                            Date intervention *
                          </label>
                          <input
                            type="date"
                            name="dateIntervention"
                            value={formData.dateIntervention}
                            onChange={handleChange}
                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">
                            Niveau d'urgence *
                          </label>
                          <select
                            name="urgence"
                            value={formData.urgence}
                            onChange={handleChange}
                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                          >
                            <option value="">Sélectionner</option>
                            <option value="urgent">🔴 Urgent (&lt; 24h)</option>
                            <option value="important">🟠 Important (1-3 jours)</option>
                            <option value="normal">🟢 Normal (&gt; 3 jours)</option>
                          </select>
                        </div>
                      </div>
                    </div>

                    {/* Catégorie */}
                    <div className="space-y-4">
                      <h2 className="text-xl font-semibold text-gray-800 border-b pb-2">
                        🔧 Type d'intervention
                      </h2>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                          Catégorie principale *
                        </label>
                        <select
                          name="categorie"
                          value={formData.categorie}
                          onChange={handleChange}
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                          <option value="">Sélectionner une catégorie</option>
                          {Object.keys(categories).map(cat => (
                            <option key={cat} value={cat}>{cat}</option>
                          ))}
                        </select>
                      </div>

                      {formData.categorie && (
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">
                            Sous-catégorie *
                          </label>
                          <select
                            name="sousCategorie"
                            value={formData.sousCategorie}
                            onChange={handleChange}
                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                          >
                            <option value="">Sélectionner</option>
                            {categories[formData.categorie].map(sub => (
                              <option key={sub} value={sub}>{sub}</option>
                            ))}
                          </select>
                        </div>
                      )}
                    </div>

                    {/* Description */}
                    <div className="space-y-4">
                      <h2 className="text-xl font-semibold text-gray-800 border-b pb-2">
                        📝 Détails de l'intervention
                      </h2>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                          Description du problème *
                        </label>
                        <textarea
                          name="description"
                          value={formData.description}
                          onChange={handleChange}
                          rows="4"
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                          placeholder="Décrivez le problème en détail..."
                        />
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                          Matériel nécessaire ? *
                        </label>
                        <select
                          name="materielNecessaire"
                          value={formData.materielNecessaire}
                          onChange={handleChange}
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                          <option value="">Sélectionner</option>
                          <option value="oui">Oui</option>
                          <option value="non">Non</option>
                          <option value="ne_sais_pas">Je ne sais pas</option>
                        </select>
                      </div>

                      {formData.materielNecessaire === 'oui' && (
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">
                            Quel matériel ?
                          </label>
                          <input
                            type="text"
                            name="materielDetails"
                            value={formData.materielDetails}
                            onChange={handleChange}
                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="Ex: Joint de robinet, ampoule LED..."
                          />
                        </div>
                      )}
                    </div>

                    {/* Contact */}
                    <div className="space-y-4">
                      <h2 className="text-xl font-semibold text-gray-800 border-b pb-2">
                        👤 Vos coordonnées
                      </h2>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                          Nom du demandeur *
                        </label>
                        <input
                          type="text"
                          name="nomDemandeur"
                          value={formData.nomDemandeur}
                          onChange={handleChange}
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                          placeholder="Votre nom complet"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">
                            Téléphone *
                          </label>
                          <input
                            type="tel"
                            name="telephone"
                            value={formData.telephone}
                            onChange={handleChange}
                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="+212 6XX XXX XXX"
                          />
                        </div>

                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-2">
                            Email *
                          </label>
                          <input
                            type="email"
                            name="email"
                            value={formData.email}
                            onChange={handleChange}
                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                            placeholder="votre@email.com"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-2">
                          Notes complémentaires (optionnel)
                        </label>
                        <textarea
                          name="notes"
                          value={formData.notes}
                          onChange={handleChange}
                          rows="3"
                          className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                          placeholder="Informations supplémentaires..."
                        />
                      </div>
                    </div>

                    <button
                      onClick={handleSubmit}
                      disabled={isSubmitting}
                      className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 px-6 rounded-lg transition duration-200 flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      {isSubmitting ? (
                        <>
                          <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                          Envoi en cours...
                        </>
                      ) : (
                        <>
                          📤 Envoyer la demande
                        </>
                      )}
                    </button>
                  </div>
                </div>

                <p className="text-center text-gray-600 mt-6 text-sm">
                  * Champs obligatoires
                </p>
              </div>
            </div>
          );
        }

        ReactDOM.render(<InterventionForm />, document.getElementById('root'));
    </script>
</body>
</html>
